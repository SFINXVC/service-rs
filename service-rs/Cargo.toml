[package]
name = "service-rs"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
all-features = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
service-rs_proc-macro = { workspace = true, optional = true }

[features]
default = ["proc-macro"]
proc-macro = ["service-rs_proc-macro"]
